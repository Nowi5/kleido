version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - copyloopvar
    - gocritic
    - misspell
    - rowserrcheck
    - noctx
    - prealloc
    - wrapcheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G101
        - G304
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
    misspell:
      locale: US
    wrapcheck:
      ignore-sigs:
        - ".Errorf("
        - "apperror."
        - "errors.New("
        - "errors.As("
        - "errors.Is("
    gocritic:
      enabled-checks:
        - appendAssign
        - dupImport
        - evalOrder
        - initClause
        - rangeValCopy
        - sloppyLen
        - truncateCmp
        - unnecessaryBlock
        - boolExprSimplify

  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - wrapcheck
          - errcheck
          - noctx
      - path: "cmd/"
        linters:
          - wrapcheck
      - path: "web/node_modules/"
        linters:
          - errcheck
          - wrapcheck
          - revive
      - path: "internal/repository/postgres/traced_user.go"
        linters:
          - wrapcheck
          - revive
      - path: "internal/telemetry/otel.go"
        linters:
          - wrapcheck
      - path: "internal/logger/logger.go"
        linters:
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
