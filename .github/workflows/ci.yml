name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.9"
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: "v2.11.4"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: TypeScript type check
        run: cd web && npm run type-check

      - name: ESLint
        run: cd web && npm run lint

      - name: React tests
        run: cd web && npm run test

  # ── 2. Swagger docs up-to-date ────────────────────────────────────────────
  swagger:
    name: Swagger docs up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # go-setup builds the UI (web/dist/) and generates *_templ.go files.
      # Both are required for swag / go list to resolve all packages without errors.
      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Check swagger docs
        run: make swagger-check

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -extldflags '-static'" \
            -o /tmp/kleido-api \
            ./cmd/api

  # ── 4. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ matrix.go }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run unit tests
        run: |
          mkdir -p reports
          TEST_PKGS=$(go list ./... | grep -Ev '/docs$|/web/node_modules|/web/components$|/internal/repository$')
          gotestsum --junitfile reports/unit.xml --format pkgname \
            -- -race -count=1 -coverprofile=coverage.out -covermode=atomic $TEST_PKGS

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit.xml

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

      - name: Check coverage gates
        run: make test-coverage-check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nowi5/kleido
          files: coverage.out
          flags: unit
          fail_ci_if_error: false

  # ── 5. Integration tests ───────────────────────────────────────────────────
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kleido_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d kleido_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://user:password@localhost:5432/kleido_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: make test-integration

  # ── 6. E2E tests ──────────────────────────────────────────────────────────
  e2e-test:
    name: E2E tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Run E2E tests
        run: go test -v -race -tags=e2e -count=1 -timeout=10m ./cmd/api/

  # ── 7. Security scanning ──────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Build container image for scanning
        run: docker build --build-arg VERSION=ci -t kleido:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "kleido:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── 8. SonarCloud analysis ────────────────────────────────────────────────
  # Runs after test so it can consume the pre-built artifacts (unit.xml +
  # coverage.out) without re-running the full test suite.
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for accurate blame / new-code detection
          fetch-depth: 0

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: reports/

      - name: Download coverage profile
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 9. Build & push Docker image (main branch only) ───────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [lint, swagger, build, test, e2e-test, security, sonar]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
