# SonarCloud project configuration
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/

# ── Identity ──────────────────────────────────────────────────────────────────
sonar.projectKey=nowi5_kleido
sonar.organization=nowi5
sonar.projectName=kleido

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=.
sonar.exclusions=\
  vendor/**,\
  web/node_modules/**,\
  web/dist/**,\
  docs/**,\
  mkdocs/**,\
  keys/**,\
  migrations/**

# ── Tests ─────────────────────────────────────────────────────────────────────
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# ── Coverage ──────────────────────────────────────────────────────────────────
# Generated by: gotestsum -- -coverprofile=coverage.out -covermode=atomic ./...
sonar.go.coverage.reportPaths=coverage.out

# Exclude generated and mock files from coverage metrics — they cannot be
# meaningfully tested and skew the reported percentage.
sonar.coverage.exclusions=\
  **/mock_*.go,\
  **/*_mock.go,\
  **/*_templ.go,\
  **/docs/**,\
  **/*_test.go,\
  web/node_modules/**,\
  web/components/**,\
  internal/repository/postgres/**,\
  internal/repository/redis/**,\
  internal/model/**,\
  internal/reqctx/**,\
  cmd/api/main.go,\
  cmd/api/routes.go,\
  cmd/api/seed.go,\
  cmd/api/swagger.go

# ── Test execution reports ────────────────────────────────────────────────────
# Generated by: gotestsum --junitfile reports/unit.xml
sonar.go.tests.reportPaths=reports/unit.xml

# ── Quality gate ──────────────────────────────────────────────────────────────
# Wait for SonarCloud quality gate result and fail CI if it is not met.
sonar.qualitygate.wait=true

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
