# SonarCloud project configuration
# Docs: https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/sonarscanner-cli/

# ── Identity ──────────────────────────────────────────────────────────────────
# Replace YOUR_ORG with your SonarCloud organization slug.
# The projectKey is typically <org>_<repo-name>.
sonar.projectKey=nowi5_kleido
sonar.organization=nowi5
sonar.projectName=kleido

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=.
sonar.exclusions=\
  **/*_test.go,\
  vendor/**,\
  web/node_modules/**,\
  web/dist/**,\
  docs/**,\
  mkdocs/**,\
  keys/**,\
  migrations/**,\
  **/mock_*.go,\
  **/*_mock.go

# ── Tests ─────────────────────────────────────────────────────────────────────
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# ── Reports ───────────────────────────────────────────────────────────────────
# Generated by: make test-ci
# JUnit XML test execution report
sonar.go.tests.reportPaths=reports/unit.xml
# Go native coverage profile (coverprofile format)
sonar.go.coverage.reportPaths=coverage.out

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
